services:
  juice-shop:
    image: ${JUICE_SHOP_IMAGE:-bkimminich/juice-shop:latest}
    container_name: soc_juice_shop
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      soc_backend:
        ipv4_address: 172.29.0.3
      soc_shared:
        aliases:
          - juice-shop

  gateway:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: soc_gateway
    restart: unless-stopped
    depends_on:
      - juice-shop
      - lab-backend
    ports:
      - "${LAB_BIND_IP:-127.0.0.1}:${LAB_PORT:-8081}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      # Pin the monitored backend network to eth0. Suricata shares this
      # network namespace and captures SURICATA_INTERFACE=eth0.
      soc_backend:
        interface_name: eth0
        ipv4_address: 172.29.0.4
      soc_shared:
        interface_name: eth1
        aliases:
          - gateway
      soc_internal:
        interface_name: eth2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/__gateway_health__ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  suricata:
    build:
      context: ./sensor
      args:
        SURICATA_IMAGE: ${SURICATA_IMAGE:-jasonish/suricata:7.0}
    container_name: soc_suricata
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    # Chia sẻ network namespace với Nginx để Suricata quan sát traffic proxy.
    network_mode: "service:gateway"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      SURICATA_INTERFACE: ${SURICATA_INTERFACE:-eth0}
      # Attacker is the only host outside HOME_NET, while remaining on the
      # isolated Docker bridge. This lets inbound ET rules keep their semantics.
      SURICATA_HOME_NET: ${SURICATA_HOME_NET:-[172.29.0.0/24,!172.29.0.10]}
      RULE_UPDATE_INTERVAL: ${RULE_UPDATE_INTERVAL:-86400}
      RULE_UPDATE_ENABLED: ${RULE_UPDATE_ENABLED:-false}
      A2_SCAN_ALIASES: ${A2_SCAN_ALIASES:-172.29.0.20/32,172.29.0.21/32,172.29.0.22/32,172.29.0.23/32,172.29.0.24/32}
    volumes:
      - ./runtime/suricata-logs:/var/log/suricata
      - suricata_state:/var/lib/suricata
    healthcheck:
      test: ["CMD-SHELL", "suricatasc -c uptime 2>/dev/null | grep -q '\"return\": \"OK\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  lab-backend:
    build:
      context: ./services/lab-backend
    image: soc-lab-backend:v2.0.0
    container_name: soc_lab_backend
    restart: unless-stopped
    expose:
      - 3001
    environment:
      INTERNAL_GATEWAY: http://soc_gateway
      INTERNAL_TOKEN: soc-lab-v2-internal
    networks:
      soc_backend:
        ipv4_address: 172.29.0.2
        aliases:
          - lab-backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [CMD, /nodejs/bin/node, /soc/healthcheck.js]
      interval: 10s
      timeout: 3s
      retries: 10

  internal-sink:
    build:
      context: ./services/sink
    image: soc-lab-sink:v2.0.0
    container_name: soc_internal_sink
    restart: unless-stopped
    environment:
      SINK_ROLE: internal
    expose:
      - 3100
    networks:
      soc_internal:
        aliases:
          - internal-sink
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  metadata-sim:
    image: soc-lab-sink:v2.0.0
    container_name: soc_metadata_sim
    restart: unless-stopped
    depends_on:
      - internal-sink
    environment:
      SINK_ROLE: metadata
    expose:
      - 3100
    networks:
      soc_internal:
        aliases:
          - metadata-sim
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  exfil-sink:
    image: soc-lab-sink:v2.0.0
    container_name: soc_exfil_sink
    restart: unless-stopped
    depends_on:
      - internal-sink
    environment:
      SINK_ROLE: exfil
    expose:
      - 3100
    networks:
      soc_internal:
        aliases:
          - exfil-sink
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  c2-sink:
    image: soc-lab-sink:v2.0.0
    container_name: soc_c2_sink
    restart: unless-stopped
    depends_on:
      - internal-sink
    environment:
      SINK_ROLE: c2
    expose:
      - 3100
    networks:
      soc_internal:
        aliases:
          - c2-sink
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  attacker:
    build:
      context: ./soc-attacker-advanced-v3.0.0
    image: soc-attack-scenarios:v2.0.0
    container_name: soc_attacker_v2
    hostname: soc-attacker-v2
    environment:
      TARGET: http://soc_gateway
      TARGET_HOST: soc_gateway
      TARGET_PORT: 80
      SAFE_MODE: true
      GROUND_TRUTH_PATH: /opt/soc/runtime/ground-truth/scenario-runs.jsonl
      WAZUH_ALERTS_PATH: /var/ossec-logs/alerts/alerts.json
      N8N_MAPPING_WEBHOOK_URL: http://host.docker.internal:5678/webhook/soc-alert-analysis
      ALERT_QUIET_SECONDS: 2.0
    networks:
      soc_backend:
        ipv4_address: 172.29.0.10
    volumes:
      - ./runtime:/opt/soc/runtime
      - wazuh_logs:/var/ossec-logs:ro
      - ./runtime/suricata-logs:/opt/soc/telemetry/suricata:ro
      - suricata_state:/opt/soc/rule-state:ro
      - ./soc-attacker-advanced-v3.0.0/data:/opt/soc/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      # suricata_state is owned by the sensor image's suricata group.
      - "998"
      - "999"
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    command: [sleep, infinity]

networks:
  soc_backend:
    name: soc_backend
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24
  soc_shared:
    external: true
  soc_internal:
    name: soc_internal
    driver: bridge
    internal: true

volumes:
  suricata_state:
    name: soc_suricata_state
  wazuh_logs:
    external: true
    name: single-node_wazuh_logs
