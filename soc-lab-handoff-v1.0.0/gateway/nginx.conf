server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location = /__gateway_health__ {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Ground-truth boundary only. Detection rules must never match this URI.
    location = /__soc_attack_marker__ {
        access_log off;
        return 204;
    }

    location /lab/ {
        proxy_http_version 1.1;
        proxy_pass http://lab-backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location /__soc_internal__/internal/ {
        if ($http_x_soc_internal_token != "soc-lab-v2-internal") { return 403; }
        proxy_pass http://internal-sink:3100/;
    }

    location /__soc_internal__/metadata/ {
        if ($http_x_soc_internal_token != "soc-lab-v2-internal") { return 403; }
        proxy_pass http://metadata-sim:3100/;
    }

    location /__soc_internal__/exfil/ {
        if ($http_x_soc_internal_token != "soc-lab-v2-internal") { return 403; }
        proxy_pass http://exfil-sink:3100/;
    }

    location /__soc_internal__/c2/ {
        if ($http_x_soc_internal_token != "soc-lab-v2-internal") { return 403; }
        proxy_pass http://c2-sink:3100/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_pass http://juice-shop:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
