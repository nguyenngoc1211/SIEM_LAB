name: soc-attacker-advanced-v3

services:
  attacker-v3:
    build:
      context: .
    image: soc-attacker-advanced:v3.0.0
    container_name: soc_attacker_v3
    hostname: soc-attacker-v3
    environment:
      TARGET: ${TARGET:-http://soc_gateway}
      TARGET_HOST: ${TARGET_HOST:-soc_gateway}
      TARGET_PORT: ${TARGET_PORT:-80}
      SAFE_MODE: ${SAFE_MODE:-true}
      ALLOW_EXTERNAL_TARGETS: ${ALLOW_EXTERNAL_TARGETS:-false}
      SCENARIO_DELAY: ${SCENARIO_DELAY:-0.05}
      MAX_BURST: ${MAX_BURST:-20}
    networks:
      - soc_backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    command: ["sleep", "infinity"]

networks:
  soc_backend:
    external: true
    name: ${SOC_NETWORK:-soc_backend}
