name: data

networks:
  soc-network:
    driver: bridge
  soc_shared:
    external: true

services:
  embedding-api:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: attack-bert-embedding
    volumes:
      - ./tei:/data
    ports:
      - "8080:80"
    command: ["--model-id", "basel/ATTACK-BERT", "--port", "80"]
    networks:
      soc-network:
      soc_shared:
        aliases:
          - embedding-api
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-db
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant:/qdrant/storage
    networks:
      soc-network:
      soc_shared:
        aliases:
          - qdrant
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-orchestrator
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENAI_CREDENTIALS_OVERRIDE=true
      - MAPPER_API_KEY=${MAPPER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - ./n8n:/home/node/.n8n
    networks:
      soc-network:
      soc_shared:
        aliases:
          - n8n
    depends_on:
      - embedding-api
      - qdrant
    restart: unless-stopped

  reranker-api:
    build:
      context: ./mitre-mapping
      dockerfile: Dockerfile.reranker
    container_name: mitre-reranker
    environment:
      RERANKER_MODEL: cross-encoder/ms-marco-MiniLM-L-6-v2
      RERANKER_REVISION: c5ee24cb16019beea0893ab7796b1df96625c6b8
      HF_HUB_OFFLINE: "1"
    ports:
      - "8082:8001"
    volumes:
      - ./tei/reranker:/models
    networks:
      soc-network:
      soc_shared:
        aliases:
          - reranker-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped

  indexer:
    build:
      context: ./mitre-mapping
      dockerfile: Dockerfile
    container_name: mitre-indexer
    command: ["python", "scripts/build_qdrant_index.py", "--wait", "300"]
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding-api:80
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-attack_techniques_v1}
    depends_on:
      - embedding-api
      - qdrant
    networks:
      - soc-network
    restart: "no"

  mapper-api:
    build:
      context: ./mitre-mapping
      dockerfile: Dockerfile
    container_name: mitre-mapper
    ports:
      - "8000:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding-api:80
      RERANKER_URL: http://reranker-api:8001
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-attack_techniques_v1}
      MAPPER_API_KEY: ${MAPPER_API_KEY:-}
      LOCAL_FALLBACK: "false"
    depends_on:
      reranker-api:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    networks:
      soc-network:
      soc_shared:
        aliases:
          - mapper-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
