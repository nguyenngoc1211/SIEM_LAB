name: soc-attack-scenarios-v2

services:
  attacker-v2:
    build:
      context: .
    image: soc-attack-scenarios:v2.0.0
    container_name: soc_attacker_v2
    hostname: soc-attacker-v2
    environment:
      TARGET: ${TARGET:-http://soc_gateway}
      TARGET_HOST: ${TARGET_HOST:-soc_gateway}
      TARGET_PORT: ${TARGET_PORT:-80}
      SAFE_MODE: ${SAFE_MODE:-true}
      ALLOW_EXTERNAL_TARGETS: ${ALLOW_EXTERNAL_TARGETS:-false}
      SCENARIO_DELAY: ${SCENARIO_DELAY:-0.05}
      MAX_BURST: ${MAX_BURST:-20}
      GROUND_TRUTH_PATH: /opt/soc/runtime/ground-truth/scenario-runs.jsonl
      MAPPER_URL: http://host.docker.internal:8000
    volumes:
      - ../runtime:/opt/soc/runtime
      - ../runtime/suricata-logs:/opt/soc/telemetry/suricata:ro
      - suricata_state:/opt/soc/rule-state:ro
      - ./data:/opt/soc/data
    networks:
      - soc_backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    group_add:
      - "998"
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 192
    command: ["sleep", "infinity"]

volumes:
  suricata_state:
    external: true
    name: soc_suricata_state

networks:
  soc_backend:
    external: true
    name: ${SOC_NETWORK:-soc_backend}
